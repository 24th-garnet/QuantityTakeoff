[project]
name = "quantity-takeoff"
version = "0.1.0"
description = "図面とスキャンの実測から内装の数量を拾う"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
takeoff = "takeoff.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["takeoff"]
